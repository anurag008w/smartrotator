# Render Blueprint — SmartRotator (auth + per-user quota + dashboard)
#
# DATA ab PostgreSQL me NAHI hai — JSON files (data/) private GitHub repo
# me sync hoti hain (har 3 min push, restart pe pull). Koi DB nahi chahiye!
#
# STEP 1: GitHub PAT banao (Settings → Developer settings → Tokens → repo scope)
#         Render me secret daalo:  GH_TOKEN="ghp_..."  (already set)
#
# STEP 2: Secrets set karo:
#   GEMINI_KEYS="key1,key2,key3"
#   GROQ_KEYS="key1,key2"
#   OPENROUTER_KEYS="key1"
#   ZEN_KEYS="key1"
#   JWT_SECRET="random-long-secret-string"
#   ADMIN_USERS="yourname"        (optional, comma separated)
#   GITHUB_REPO="youruser/smartrotator-data"   (private repo — auto-create)
#   GITHUB_SYNC_ENABLED="true"
#   GITHUB_SYNC_INTERVAL="180"    (3 min)
#
# SECURITY (production grade):
#   - JWT_SECRET na do → server pehli baar pe data/.jwt-secret auto-generate
#     karega (chmod 600). Production me env se DO, taaki restart pe token
#     invalidate na hon.
#   - STORE_ENC_KEY optional: API keys at-rest AES-256-GCM se encrypt hain.
#     Agar env se na do, data/.store-enc-key (git-ignored) auto-generate
#     hota hai. AGAR ye file kharab/lost ho → stored keys unrecoverable,
#     isliye production me env se dena best hai.
#   - data/ ab git me track hota hai (public repo!). Api keys hamesha
#     encrypted rahte hain; .jwt-secret / .store-enc-key / .sync-enc-key
#     kabhi sync nahi hote (dotfiles ignore).

services:
  - type: web
    name: smartrotator
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn rotator.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ROTATOR_CONFIG
        value: config.yaml
      - key: GITHUB_SYNC_ENABLED
        value: "true"
      - key: GITHUB_SYNC_INTERVAL
        value: "180"
      - key: GEMINI_KEYS
        sync: false
      - key: GROQ_KEYS
        sync: false
      - key: OPENROUTER_KEYS
        sync: false
      - key: ZEN_KEYS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STORE_ENC_KEY
        sync: false
      - key: ADMIN_USERS
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false

  # Keep-alive: cron-job.org pe banaya hai (jobId 8205944) — har 10 min me
  # https://smartrotator.onrender.com/health ping (free tier sleep na ho).
  # Render ka paid cron plan nahi chahiye isliye bahar ka scheduler use kar rahe hain.
